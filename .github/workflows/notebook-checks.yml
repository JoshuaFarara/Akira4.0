name: Notebook checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Notebook checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate notebooks
        run: python scripts/check_notebooks.py
      - name: Block data and model files
        run: |
          bad=$(git ls-files | grep -E '\.(jsonl|pth|pt|ckpt|safetensors)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Datasets/weights must live in Google Drive, not git:"; echo "$bad"; exit 1
          fi
